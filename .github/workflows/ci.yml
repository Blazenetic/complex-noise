name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npx eslint js

      - name: Test
        run: npm test
