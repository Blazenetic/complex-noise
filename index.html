<!DOCTYPE html>
<html lang="en" data-still-theme="dark" data-glass="standard">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0C0C11" id="themeColorMeta" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Complex Noise by Complex State — Seamless brown noise for deep rest. Still Theme, Still Field, Still EQ." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <!-- Simple mathematical favicon (soft abstract field mark) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C0C11'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%236B3FA0' stroke-width='1.5' opacity='0.7'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%236B3FA0' opacity='0.5'/%3E%3C/svg%3E" />
  <title>Complex Noise | Complex State</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Procedural texture layer (Still Theme) -->
  <div class="still-texture" aria-hidden="true"></div>

  <!-- Still Field — full-page nodes + edges visualisation -->
  <canvas id="stillField" aria-hidden="true"></canvas>

  <header>
    <div class="logo">Complex Noise</div>
    <div class="byline">by Complex State</div>
    <div class="tagline">Seamless noise for deep rest</div>
    <div class="still-theme-row">
      <button id="stillThemeToggle" class="still-theme-toggle" type="button" aria-label="Toggle Still Theme between Dark and Bone">
        <span class="still-theme-icon" id="stillThemeIcon" aria-hidden="true">◐</span>
        <span class="still-theme-label" id="stillThemeLabel">Still · Dark</span>
      </button>
    </div>
  </header>

  <main>
    <div class="play-wrap">
      <!-- Icon is swapped by app.js; data-icon tracks which one is mounted. -->
      <button id="playBtn" aria-label="Play noise" aria-pressed="false" data-icon="play" type="button">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="types" role="group" aria-label="Noise type">
      <button class="type-btn active" data-type="brown" aria-pressed="true" type="button">Brown</button>
      <button class="type-btn" data-type="pink" aria-pressed="false" type="button">Pink</button>
      <button class="type-btn" data-type="white" aria-pressed="false" type="button">White</button>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.4" />
      </div>

      <div class="control-group">
        <label for="timer">Sleep timer</label>
        <select id="timer" aria-label="Sleep timer duration">
          <option value="0">Off</option>
          <option value="1">1 hour</option>
          <option value="2">2 hours</option>
          <option value="4">4 hours</option>
          <option value="8">8 hours</option>
          <option value="10">10 hours</option>
        </select>
      </div>

      <!-- Still Field — always visible for easy on/off -->
      <div class="still-field-controls">
        <div class="still-toggle-row">
          <span id="stillFieldLabel">Still Field</span>
          <button type="button" class="still-switch" id="stillFieldToggle" role="switch" aria-checked="true" aria-labelledby="stillFieldLabel"></button>
        </div>
        <div class="still-field-row">
          <label for="stillFieldIntensity">Intensity</label>
          <input type="range" id="stillFieldIntensity" min="0" max="1" step="0.05" value="0.55" />
        </div>
        <!-- Range must match STILL_SPEED_MIN / STILL_SPEED_MAX in js/constants.js -->
        <div class="still-field-row">
          <label for="stillFieldSpeed">Speed</label>
          <input type="range" id="stillFieldSpeed" min="0.4" max="2" step="0.05" value="1.25" />
        </div>
        <div class="still-toggle-row is-secondary">
          <span id="stillGlassLabel">Ultra-transparent glass</span>
          <button type="button" class="still-switch" id="stillGlassToggle" role="switch" aria-checked="false" aria-labelledby="stillGlassLabel"></button>
        </div>
      </div>

      <!-- Still EQ (collapsible to keep main surface calm) -->
      <details class="still-panel" id="stillPanel">
        <summary>Still EQ</summary>
        <div class="still-panel-body">
          <div class="still-eq-row">
            <label for="stillEqLow">Low</label>
            <input type="range" id="stillEqLow" min="-12" max="12" step="0.5" value="0" />
          </div>
          <div class="still-eq-row">
            <label for="stillEqMid">Mid</label>
            <input type="range" id="stillEqMid" min="-12" max="12" step="0.5" value="0" />
          </div>
          <div class="still-eq-row">
            <label for="stillEqHigh">High</label>
            <input type="range" id="stillEqHigh" min="-12" max="12" step="0.5" value="0" />
          </div>
        </div>
      </details>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">Ready</div>
  </main>

  <footer>
    <span>Procedural · Infinite · Offline</span>
    <span class="sep">·</span>
    <a href="https://github.com/Blazenetic/complex-noise" target="_blank" rel="noopener noreferrer">Source</a>
    <br />
    <span>MIT License</span>
    <span class="sep">·</span>
    <span>Made in Australia with the help of AI agents</span>
    <br />
    Complex State
  </footer>

  <!-- ES modules — load order is resolved by the import graph from app.js -->
  <script type="module" src="js/app.js"></script>

  <!--
    Boot guard (classic script, so it runs even when the module graph fails).
    ES modules are fetched with CORS, which the file:// protocol forbids — so
    double-clicking index.html leaves a silent, dead page. Say so instead.
  -->
  <script>
    window.addEventListener('load', function () {
      if (window.complexNoiseStill) return;
      var status = document.getElementById('status');
      if (!status) return;
      status.textContent = location.protocol === 'file:'
        ? 'Complex Noise uses ES modules, which browsers refuse to load from file://. Serve this folder over http:// — see the README.'
        : 'Complex Noise failed to load. Check the browser console for details.';
    });
  </script>

  <noscript>
    <p style="text-align:center;padding:16px">Complex Noise generates audio in your browser and needs JavaScript enabled.</p>
  </noscript>
</body>
</html>
