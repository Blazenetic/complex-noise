name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run is a wasted run. Pushing three times to a branch used to start
# three full browser suites and let the first two finish into the void. Keyed per
# pull request (or per ref on main) so branches never cancel each other, and
# never cancelling on `main` — a push there is the record of what was actually
# merged, and cancelling it leaves the default branch with no result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Decide what actually needs running.
  #
  # The obvious way to skip a docs-only change is `paths-ignore:` on the trigger.
  # Do not do that here. A workflow filtered out by `paths-ignore` does not run,
  # and a job that does not run reports **no status at all** — so any required
  # check pointing at it sits on "Expected — waiting for status to be reported"
  # and the pull request can never merge. The failure mode is a permanently
  # blocked docs PR, which is precisely the PR you were trying to speed up.
  #
  # So the filtering happens *inside* the workflow instead. This job always runs,
  # always reports, and decides whether the expensive jobs have anything to do.
  # The required check is `CI` at the bottom, which likewise always runs.
  # --------------------------------------------------------------------------
  gate:
    name: Decide what needs running
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs both sides of the comparison. Actions checks out a
          # single commit by default, and diffing against a base that was never
          # fetched fails outright rather than quietly returning nothing.
          fetch-depth: 0

      - name: Classify the changed files
        id: decide
        env:
          # Read through the environment rather than interpolating `${{ }}`
          # straight into the shell. A branch name, a label or a commit message
          # is attacker-controlled text on a fork pull request, and `${{ }}` is
          # substituted *before* the shell parses the script — so a commit
          # subject containing a backtick or `$(...)` would execute on the
          # runner. Through `env:` it is only ever data.
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          decide() {
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "### $2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # --- Opt-out 1: a `skip-ci` label on the pull request ---------------
          # GitHub's own skip handling reads commit messages only, so a label is
          # the one opt-out you can apply to an existing PR without rewriting its
          # history — and the one you can remove again to get a run back.
          case ",$PR_LABELS," in
            *,skip-ci,*) decide false "Skipped: the pull request carries the \`skip-ci\` label." ;;
          esac

          # --- Opt-out 2: a skip marker in the head commit message ------------
          # GitHub honours these natively on `push`, but *not* on `pull_request`
          # — the marker is consulted for the event that created the run, and a
          # PR run is created by the pull request rather than by the commit.
          # Checking it here is what makes `[skip ci]` mean the same thing on
          # both events instead of being quietly ignored on every PR.
          MESSAGE="$(git log -1 --pretty=%B "$HEAD_SHA")"
          case "$MESSAGE" in
            *"[skip ci]"*|*"[ci skip]"*|*"[skip-ci]"*|*"[no ci]"*)
              decide false "Skipped: the head commit message asks to skip CI." ;;
          esac

          # --- Work out what changed ------------------------------------------
          if [ "$EVENT" = "pull_request" ]; then
            # Three dots: compare against the merge base, so commits that landed
            # on main after this branch started are not counted as its work. With
            # two dots, every unrelated merge to main would make a docs-only PR
            # look like it had touched code.
            RANGE="$BASE_SHA...$HEAD_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          else
            # A brand-new branch, a force push, or the first commit. There is no
            # honest "before" to diff against, so run everything.
            decide true "Running everything: no comparable base for this push."
          fi

          if ! CHANGED="$(git diff --name-only "$RANGE" 2>/dev/null)" || [ -z "$CHANGED" ]; then
            # Every uncertain case resolves to *running* the suite. A skip rule
            # that guesses wrong in the other direction ships untested code.
            decide true "Running everything: could not resolve a file list for $RANGE."
          fi

          {
            echo "Changed files:"
            echo '```'
            echo "$CHANGED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # --- Is any of it code? ---------------------------------------------
          # An allow-list of paths that cannot affect the browser suite.
          # Everything not matched counts as code, so a new top-level directory
          # is tested by default rather than silently skipped.
          #
          # `.github/**` is deliberately absent: a change to this very workflow
          # must run the suite whose rules it is changing.
          CODE=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|*.md|LICENSE|.gitignore) ;;
              *) CODE=true; break ;;
            esac
          done <<< "$CHANGED"

          if [ "$CODE" = "true" ]; then
            decide true "Running the full suite: the change touches code."
          fi
          decide false "Skipped: documentation-only change."

  test:
    name: Browser smoke tests
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the browser cache paired with the exact Playwright version selected
      # by package-lock.json whenever the lockfile is updated.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser binary is cached; the apt packages it links against are not,
      # because they live outside the cached directory. Re-asserting them on a
      # cache hit costs seconds. The ~170 MB browser download does not.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # --------------------------------------------------------------------------
  # The single required status check.
  #
  # `if: always()` is what makes a docs-only pull request mergeable: this job
  # runs and reports whatever the gate decided, including when `test` was
  # skipped. Point branch protection at this job — never at `test` — or a
  # skipped `test` leaves the required check unreported and the PR stuck on
  # "Expected".
  #
  # `needs.test.result` is one of success / failure / cancelled / skipped, and
  # `skipped` is only acceptable when the gate is the thing that asked for it.
  # --------------------------------------------------------------------------
  ci:
    name: CI
    needs: [gate, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          GATE: ${{ needs.gate.result }}
          TESTS: ${{ needs.test.result }}
          WANTED: ${{ needs.gate.outputs.code }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: |
          set -euo pipefail
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

          if [ "$GATE" != "success" ]; then
            echo "The gate job did not complete (result: $GATE)." >&2
            exit 1
          fi

          if [ "$WANTED" != "true" ]; then
            echo "$REASON"
            exit 0
          fi

          if [ "$TESTS" != "success" ]; then
            echo "Browser smoke tests: $TESTS" >&2
            exit 1
          fi
          echo "Browser smoke tests passed."
